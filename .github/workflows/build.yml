name: Build Pawly

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Generate missing Android project files
        # Only creates files that are not in the repository (gradle wrapper,
        # settings, styles). Our own manifest, gradle file and icons are kept.
        run: flutter create --platforms=android --org com.pawlyapp --project-name pawly .

      - name: Download packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Add signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.SIGNING_BUNDLE }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "::warning::No SIGNING_BUNDLE secret found. Building with a debug key (OK for testing, NOT for Play Store)."
            exit 0
          fi
          mkdir -p signing
          echo "$SIGNING_BUNDLE" | base64 --decode | tar -xzf - -C signing
          mv signing/upload-keystore.jks android/app/upload-keystore.jks
          mv signing/key.properties android/key.properties
          rm -rf signing
          echo "Signing key added."

      - name: Build APK (install on your phone to test)
        run: flutter build apk --release

      - name: Build App Bundle (upload this to Google Play)
        run: flutter build appbundle --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: pawly-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Save App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pawly-aab-for-play-store
          path: build/app/outputs/bundle/release/app-release.aab
