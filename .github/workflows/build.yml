name: Build Pawly

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Generate missing Android project files
        # Only creates files that are not in the repository (gradle wrapper,
        # settings, styles). Our own manifest, gradle file and icons are kept.
        run: flutter create --platforms=android --org com.pawlyapp --project-name pawly .

      - name: Download packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Add signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets found. Building with a debug key (OK for testing, NOT for Play Store)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          sed -i 's/^ *//' android/key.properties
          echo "Signing key added."

      - name: Build APK (install on your phone to test)
        run: flutter build apk --release

      - name: Build App Bundle (upload this to Google Play)
        run: flutter build appbundle --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: pawly-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Save App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pawly-aab-for-play-store
          path: build/app/outputs/bundle/release/app-release.aab
